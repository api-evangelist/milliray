name: Milliray
description: >-
  Milliray is an airspace-security company building millimeter-wave radar
  technology to detect, track, and classify the small drones that conventional
  radar systems miss — from $50 quadcopters to autonomous swarms. Its DroneTector
  product fuses multiple sensor types into all-weather, 24/7 units that operate
  standalone or in networked mesh configurations, protecting airports, critical
  infrastructure (substations, refineries, water-treatment facilities), and
  forward-deployed defense operations. The company is backed by Y Combinator,
  NATO DIANA, the UK Defence and Security Accelerator, and the Royal Academy of
  Engineering. As of this enrichment pass Milliray publishes no public API,
  developer portal, SDK, or documentation surface — it is a hardware/defense
  provider without a programmable interface.
